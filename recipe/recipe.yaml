context:
  name: conda-mirror
  version: "0.12.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/conda-incubator/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 4e3eddf197d41829e9a443662ac2679178ab3da4fdd704bcfc284c63e68f0f2c

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
      # aws-lc-sys (pulled in via aws-config/rustls) needs clang-cl to assemble
      # its ARM64 perlasm `.S` files on Windows; MSVC's cl.exe silently drops
      # them, which results in a link error. Harmless no-op on other targets.
      # https://aws.github.io/aws-lc-rs/requirements/windows.html
      CC_aarch64_pc_windows_msvc: clang-cl
      AR_aarch64_pc_windows_msvc: llvm-lib
    content:
      - if: win
        then:
          - cargo auditable install --no-track --locked --root %PREFIX% --path .
          - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
        else:
          # rust-lld cannot handle the ppc64le relocations emitted for
          # libdbus-sys, so link with GNU ld there instead
          - if: target_platform == "linux-ppc64le"
            then: export CARGO_BUILD_RUSTFLAGS="${CARGO_BUILD_RUSTFLAGS:-} -C link-arg=-fuse-ld=bfd"
          - export "OPENSSL_DIR=$PREFIX"
          - cargo auditable install --no-track --locked --root $PREFIX --path .
          - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - pkg-config
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - if: win and arm64
      then: clang # provides clang-cl, required by aws-lc-sys on win-arm64
  host:
    - openssl

tests:
  - script:
      - conda-mirror --help
  - package_contents:
      bin:
        - conda-mirror
      strict: true

about:
  homepage: https://github.com/conda-incubator/conda-mirror
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: Mirror conda channels

extra:
  recipe-maintainers:
    - ericdill
    - parente
    - scopatz
    - xhochy
    - pavelzw
    - delsner
